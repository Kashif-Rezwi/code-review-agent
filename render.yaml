version: "1"
services:
  - type: web
    name: code-review-agent-api
    env: node
    # Only deploy from the main branch
    branch: main
    # Root Directory must be empty for pnpm monorepo to resolve workspace packages
    rootDir: ""
    # Only rebuild the backend if server code, shared packages, or root dependencies change
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    buildCommand: pnpm install && pnpm build:packages && pnpm --filter server build
    startCommand: pnpm --filter server start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
