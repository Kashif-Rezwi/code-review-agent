version: "1"
services:
  - type: redis
    name: code-review-agent-redis
    plan: free
    ipAllowList: []

  - type: web
    name: code-review-agent-api
    env: node
    branch: main
    rootDir: ""
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    buildCommand: pnpm install && pnpm build:packages && pnpm --filter server build
    startCommand: pnpm --filter server start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: code-review-agent-redis
          property: connectionString
