version: "1"
services:
  - type: redis
    name: code-review-agent-redis
    plan: free
    ipAllowList: []

  - type: web
    name: code-review-agent-api
    env: node
    # Deploys happen only from main — pushes to develop do NOT auto-deploy.
    branch: main
    rootDir: ""
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - "!docs/**"
        - "!README.md"
    buildCommand: pnpm install && pnpm build:packages && pnpm --filter server build
    startCommand: pnpm --filter server start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      # Chat router: vercel-gateway (default) | openrouter. Embeddings always
      # stay on the Vercel AI Gateway, so AI_GATEWAY_API_KEY is required either way.
      - key: AI_ROUTER
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Neon PostgreSQL (external) — set both in the Render dashboard.
      # Without a reachable DATABASE_URL the API boots degraded; DB-backed features fail.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: code-review-agent-redis
          property: connectionString
      # Razorpay (Prepaid Credits) — set in the Render dashboard; never commit actual values.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Hidden ₹1 dev pack — set to a random operator-chosen secret in the dashboard;
      # unlock via /account?dev_pack=<same secret>. The value must never be committed.
      - key: PAYMENTS_DEV_PACK
        sync: false
      # Credit pricing tunables — optional; safe defaults live in credit-cost.policy.ts.
      # Set in the dashboard only to retune pricing without a redeploy.
      - key: RAZORPAY_FEE_RATE
        sync: false
      - key: USD_INR
        sync: false
      - key: CREDIT_SAFETY_FACTOR
        sync: false
