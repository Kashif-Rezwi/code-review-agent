name: code-review-agent

services:
  # ─────────────────────────────────────────────────────────
  # NestJS Backend
  # ─────────────────────────────────────────────────────────
  server:
    build:
      context: .                        # build from repo root to access workspace files
      dockerfile: apps/server/Dockerfile
      # No DB URL args needed — prisma generate uses a dummy URL at build time.
      # Real URLs are injected at runtime via env_file below.
    image: cra-server:local
    container_name: cra-server
    env_file:
      - apps/server/.env                # runtime env vars (port, API keys, DB URL)
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    networks:
      - app-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────────────────
  client:
    build:
      context: .                        # build from repo root to access workspace files
      dockerfile: apps/client/Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be baked in at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: cra-client:local
    container_name: cra-client
    env_file:
      - apps/client/.env                # runtime env vars (NEXTAUTH_SECRET, etc.)
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Tell the client where to reach the server (server-to-server inside Docker)
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
