name: code-review-agent

# NOTE: there is intentionally no Postgres service here. The API expects an
# external PostgreSQL with pgvector (DATABASE_URL/DIRECT_URL in
# apps/server/.env, e.g. Neon). Bundling pgvector would make compose much
# heavier than it is worth for local parity.
# Run migrations against your database before `docker compose up`:
#   cd apps/server && npx prisma migrate deploy
# Note: Razorpay webhook testing in local dev requires an HTTP tunnel
# (e.g. ngrok or localtunnel) to route webhooks from Razorpay to http://localhost:4000/payments/webhook.

services:
  # ─────────────────────────────────────────────────────────
  # Redis Queue Broker
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cra-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # NestJS Backend
  # ─────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: cra-server:local
    container_name: cra-server
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: cra-client:local
    container_name: cra-client
    env_file:
      - apps/client/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      server:
        condition: service_started
    healthcheck:
      # / redirects to /login behind auth — probe /login directly (returns 200).
      # Use 127.0.0.1, not localhost: busybox wget tries ::1 first and never falls
      # back, while the Next standalone server binds IPv4-only (0.0.0.0).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
